name: Verify and deploy Webbtjanst

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webbtjanst-production
  cancel-in-progress: false

jobs:
  verify-and-deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: checkout-backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Test backend
        run: npm test
      - name: Typecheck backend
        run: npm run typecheck
      - name: Deploy Convex production functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --typecheck enable --message "GitHub Actions $GITHUB_SHA"

  verify-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify production artifact
        run: node scripts/verify-production-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [verify-and-deploy-backend, verify-site]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
